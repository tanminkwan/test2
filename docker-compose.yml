version: '3.8'

services:
  # PostgreSQL Database for User Service
  user-service-db:
    image: postgres:15
    container_name: vehicle-game-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1q2w3e4r!!"
      POSTGRES_DB: postgres
    volumes:
      - user_service_data:/var/lib/postgresql/data
      - ./services/user-service/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - vehicle-game-network

  # User Service
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: user-service
    container_name: vehicle-game-user-service
    depends_on:
      user-service-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
      DB_TYPE: postgres
      DB_HOST: user-service-db
      DB_PORT: 5432
      DB_NAME: vehicle_game
      DB_USER: app_user
      DB_PASS: "app123!@#"
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRY: 24h
      ALLOW_EXTERNAL_ACCESS: false
    # ports:
    #   - "3002:3002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vehicle-game-network

  # Game Service
  game-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: game-service
    container_name: vehicle-game-game-service
    depends_on:
      user-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      ALLOW_EXTERNAL_ACCESS: false
    # ports:
    #   - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vehicle-game-network

  # Nginx API Gateway
  nginx:
    image: nginx:alpine
    container_name: vehicle-game-nginx
    depends_on:
      user-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vehicle-game-network

  # Event Processor Service
  event-processor-service:
    build:
      context: ./services/event-processor-service
    environment:
      - PORT=3003
      - NODE_ENV=development
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - INFLUXDB_URL=http://influxdb:8086
    depends_on:
      - redis
      - postgres
      - influxdb
    networks:
      - backend
    volumes:
      - ./services/event-processor-service:/usr/src/app
      - /usr/src/app/node_modules

  # Statistics Service
  statistics-service:
    build:
      context: ./services/statistics-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=development
      - POSTGRES_HOST=postgres
      - INFLUXDB_URL=http://influxdb:8086
      - CACHE_ENABLED=true
      - CACHE_TTL=300
    depends_on:
      - postgres
      - influxdb
    networks:
      - backend
    volumes:
      - ./services/statistics-service:/usr/src/app
      - /usr/src/app/node_modules

  # PostgreSQL Database
  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vehicle_game
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  # Redis for Caching and Pub/Sub
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - backend

  # InfluxDB for Time Series Data
  influxdb:
    image: influxdb:2.0
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=vehicle_game
      - DOCKER_INFLUXDB_INIT_BUCKET=game_metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - backend

networks:
  vehicle-game-network:
    driver: bridge
  frontend:
  backend:

volumes:
  user_service_data:
  postgres_data:
  influxdb_data: 