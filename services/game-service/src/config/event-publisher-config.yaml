publishers:
  - type: redis
    host: localhost
    port: 6379
    channel: game-events
    priority: 10  # 높은 우선순위 (낮은 값)
    
  - type: file
    logDir: ./logs/events
    filePrefix: game_events_
    fileExt: .jsonl
    maxFileSize: 10485760 # 10MB
    flushIntervalMs: 100
    rotationPolicy: size
    maxRetry: 3
    encoding: utf8
    priority: 20  # 낮은 우선순위 (높은 값) 